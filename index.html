<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg)}
.app{position:relative;width:100%;height:100%;min-height:420px;overflow:hidden;background:var(--bg);color:var(--text);

.app svg{display:block}
.view{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.view.on{display:flex;animation:vin .28s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:5px;height:5px}.scroll::-webkit-scrollbar-thumb{background:var(--var);border-radius:4px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.rp{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;pointer-events:none;transform:scale(0);animation:rip .55s var(--ease) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

.big-title{font-size:34px;font-weight:600;padding:24px 22px 18px;letter-spacing:-.3px}
.card{background:var(--s1);border-radius:26px;padding:16px;margin:0 12px 12px}
.card h2{margin:6px 8px 12px;font-size:25px;font-weight:600}
.tbtn{width:84px;height:84px;border-radius:22px;background:var(--sec);color:var(--onsec);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13.5px;font-weight:500;position:relative;transition:transform .15s var(--ease),filter .15s}

.fabx{position:absolute;right:20px;bottom:22px;width:58px;height:58px;border-radius:18px;background:var(--pc);color:var(--onpc);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:3;transition:transform .15s}
.fabx:active{transform:scale(.92)}
/* popups */
.pbk{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;z-index:50;animation:fin .2s var(--ease)}
@keyframes fin{from{opacity:0}to{opacity:1}}
.pop{background:var(--s3);border-radius:28px;padding:22px 20px 18px;width:min(94%,440px);max-height:88%;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:pin .28s var(--ease)}

.btn.pri{background:var(--pri);color:var(--onpri)}

select.field option{background:var(--s3);color:var(--text)}
.sw{width:52px;height:32px;border-radius:16px;background:var(--bg);border:2px solid var(--out);position:relative;flex:none;transition:background .2s,border-color .2s}

.sw.on{background:var(--pri);border-color:var(--pri)}
.sw.on::after{left:25px;top:4px;width:24px;height:24px;background:var(--onpri)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:6px;background:linear-gradient(to right,var(--pri) var(--p,50%),var(--sec) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--pri);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.5)}

.fabp{background:rgba(12,14,11,.88);border-radius:28px;padding:5px;display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:max-height .3s var(--ease),opacity .2s;box-shadow:0 2px 12px rgba(0,0,0,.45)}

.fabp button{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--onpc)}
.fabp button.on{background:var(--sec)}
.fabp .chev svg{transition:transform .3s var(--ease)}

.toolpop{position:absolute;right:66px;top:8px;background:var(--s3);border-radius:18px;padding:6px;z-index:7;box-shadow:var(--shadow);animation:pin .2s var(--ease)}

.phwrap{position:relative;flex:none;background:var(--bg);border-top:1px solid var(--outv)}

const K1 = {}, K2 = {};
KB.forEach(s => K1[s[0]] = s.slice(1)); KD.forEach(s => K2[s.slice(0, 2)] = s.slice(2));
function hira2romaji(str) {
  const s = [...str].map(c => { const k = c.charCodeAt(0); return (k >= 0x30A1 && k <= 0x30F6) ? String.fromCharCode(k - 0x60) : c; }).join('');
  let out = '', i = 0, gem = false;
  while (i < s.length) {
    const c = s[i], d = s.substr(i, 2); let r = null, adv = 1;
    if (c === 'っ') { gem = true; i++; continue; }
    if (c === 'ー') { const m = out.match(/[aiueo]$/); out += m ? m[0] : ''; i++; continue; }
    if (K2[d]) { r = K2[d]; adv = 2; } else if (K1[c]) r = K1[c];
    if (r === null) { out += c; i++; gem = false; continue; }
    if (gem) { out += (r[0] === 'c' ? 't' : r[0]); gem = false; }
    out += r; i += adv;
  }
  return out;
}
